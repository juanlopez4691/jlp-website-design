<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;padding:24px;background:var(--mint);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.6}*{box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.dark{background:var(--teal);padding:16px;border-radius:var(--radius-lg)}
.btn{position:relative;display:inline-block;font:600 16px/24px var(--font-sans);padding:13px 24px;border-radius:var(--radius-none);border:2px solid var(--ink);text-decoration:none;outline:2px solid transparent;outline-offset:2px;transition:background-color .15s,color .15s}
.btn:after{content:"";position:absolute;inset:-4px;border:2px solid transparent;pointer-events:none}
.btn:focus-visible{outline-color:var(--ink)}.btn:focus-visible:after{border-color:var(--mint)}
.primary{background:var(--ink);color:var(--mint)}.primary:hover{background:var(--saffron);color:var(--ink)}
.secondary{background:transparent;color:var(--ink)}.secondary:hover{background:var(--ink);color:var(--mint)}
.primary-on-dark{background:var(--saffron);border-color:var(--saffron);color:var(--ink)}.primary-on-dark:hover{background:var(--ink);border-color:var(--ink);color:var(--mint)}
.secondary-on-dark{background:transparent;border-color:var(--mint);color:var(--mint)}.secondary-on-dark:hover{background:var(--mint);color:var(--ink)}
.dark .btn:focus-visible{outline-color:var(--saffron)}.dark .btn:focus-visible:after{border-color:var(--ink)}</style></head><body><div class="row"><a class="btn primary" href="#">Tell me about your project</a><a class="btn secondary" href="#">Download my CV</a><div class="dark row"><a class="btn primary-on-dark" href="#">Email me</a><a class="btn secondary-on-dark" href="#">LinkedIn</a></div></div></body></html>
