<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:24px;background:var(--mint);color:var(--navy);font-family:var(--font-sans);font-size:16px;line-height:1.6}*{box-sizing:border-box}h3,p,dl,dd,figure,blockquote{margin:0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.btn{display:inline-block;font:600 16px/24px var(--font-sans);padding:13px 24px;border-radius:var(--radius-button);border:2px solid var(--navy);background:var(--navy);color:var(--mint);text-decoration:none}.btn.out{background:transparent;color:var(--navy)}.dark{background:var(--teal);padding:16px;border-radius:var(--radius-sm)}.dark .btn{background:var(--saffron);border-color:var(--saffron);color:var(--navy)}.dark .btn.out{background:transparent;color:var(--mint);border-color:var(--mint)}</style></head><body><div class="row"><a class="btn">Tell me about your project</a><a class="btn out">Download CV</a><div class="dark row"><a class="btn">Email me</a><a class="btn out">LinkedIn</a></div></div></body></html>
