<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:24px;background:var(--mint);color:var(--navy);font-family:var(--font-sans);font-size:16px;line-height:1.6}*{box-sizing:border-box}h3,p,dl,dd,figure,blockquote{margin:0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}body{background:var(--saffron)}.big{background:var(--navy);color:var(--mint);border-radius:var(--radius-28);padding:40px;margin-bottom:20px}.big p{font:300 30px/1.2 var(--font-sans);letter-spacing:-.01em}.who{margin-top:18px;font-size:15px}.who b{display:block;font-weight:600;font-size:17px}.qg{display:grid;grid-template-columns:1fr 1fr;gap:20px}.qc{background:#fff;border-radius:var(--radius-28);padding:26px}</style></head><body><figure class="big" style="margin:0 0 20px"><blockquote style="margin:0"><p>He is a WordPress developer with solid technical ability, especially notable for the quality and clarity of his code.</p></blockquote><figcaption class="who"><b>Name Surname</b>Senior Product Manager, client</figcaption></figure><div class="qg"><figure class="qc" style="margin:0"><blockquote style="margin:0"><p>Joan is great to work with. He is supportive, knowledgeable and always there to help carry the team.</p></blockquote><figcaption class="who"><b>Name Surname</b>CMO</figcaption></figure><figure class="qc" style="margin:0"><blockquote style="margin:0"><p>He takes ownership of his work and consistently delivers high-quality results.</p></blockquote><figcaption class="who"><b>Name Surname</b>IT consultant</figcaption></figure></div></body></html>
