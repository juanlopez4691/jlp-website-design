<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:24px 24px 24px 24px;background:var(--mint);color:var(--navy);font-family:var(--font-sans);font-size:16px;line-height:1.6}*{box-sizing:border-box}h3,p,dl,dd,figure,blockquote{margin:0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.job{display:grid;grid-template-columns:32px 176px 1fr;gap:6px 0;padding:0 0 40px;position:relative}.job:last-child{padding-bottom:0}.job:before{content:'';position:absolute;left:11px;width:2px;top:0;bottom:0;background:var(--navy)}.job:first-child:before{top:17px}.job:last-child:before{bottom:calc(100% - 17px)}.node{position:absolute;left:5px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--navy);box-sizing:border-box}.job:first-child .node{background:var(--saffron);border:2px solid var(--navy)}.node:after{content:'';position:absolute;left:14px;top:5.25px;width:14px;height:1.5px;background:var(--navy)}.when{grid-column:2;font:600 14.4px/23px var(--font-sans);align-self:start;background:var(--saffron);border-radius:99px;padding:2px 14px;justify-self:start;white-space:nowrap}.job h3{font:700 23.2px/1.15 var(--font-display)}.job h3 span{display:block;margin-top:4px;font:500 16px var(--font-sans)}.job p{margin-top:5px;max-width:62ch}</style></head><body><div><div class="job"><i class="node"></i><span style="grid-column:2" class="when">Jan 2021 to Present</span><div style="grid-column:3;margin-left:24px"><h3>Backend Architect and Co-Founder <span>somoscuatro</span></h3><p>Technical delivery for 15+ client companies across ecommerce, SaaS and content platforms.</p></div></div><div class="job"><i class="node"></i><span style="grid-column:2" class="when">Aug 2017 to Jan 2021</span><div style="grid-column:3;margin-left:24px"><h3>Senior Web Developer <span>netzstrategen GmbH</span></h3><p>WordPress and WooCommerce projects for 15+ clients at a German digital agency.</p></div></div></div></body></html>
