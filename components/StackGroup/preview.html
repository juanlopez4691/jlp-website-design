<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:24px;background:var(--mint);color:var(--navy);font-family:var(--font-sans);font-size:16px;line-height:1.6}*{box-sizing:border-box}h3,p,dl,dd,figure,blockquote{margin:0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}body{background:var(--navy);color:var(--mint)}h3{font:600 13.1px/21px var(--font-sans);letter-spacing:1.84px;text-transform:uppercase;color:var(--saffron);margin-bottom:12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:36px 40px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:500 15.2px/24px var(--font-sans);padding:4px 14px;border-radius:99px;border:1.5px solid var(--mint)}.core .chip{background:var(--saffron);border-color:var(--saffron);color:var(--navy);font-weight:600}</style></head><body><div class="g"><div class="core"><h3>CMS</h3><div class="chips"><span class="chip">WordPress</span><span class="chip">WooCommerce</span><span class="chip">Statamic</span></div></div><div><h3>Databases</h3><div class="chips"><span class="chip">MySQL</span><span class="chip">PostgreSQL</span></div></div></div></body></html>
