<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:24px;background:var(--mint);color:var(--navy);font-family:var(--font-sans);font-size:16px;line-height:1.6}*{box-sizing:border-box}h3,p,dl,dd,figure,blockquote{margin:0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.tag{align-self:flex-start;font:600 12.5px/20px var(--font-sans);letter-spacing:1px;text-transform:uppercase;padding:3px 11px;border-radius:var(--radius-pill);background:var(--saffron)}.tag.c2{background:var(--coral)}.tag.c3{background:var(--navy);color:var(--mint)}.chip{font:500 12.8px/20px var(--font-sans);padding:2px 11px;border-radius:var(--radius-pill);border:1.5px solid currentColor}.date{font:600 14.4px/23px var(--font-sans);background:var(--saffron);border-radius:var(--radius-pill);padding:2px 14px}.fact{border:2px solid var(--navy);border-radius:var(--radius-pill);padding:6px 18px;display:flex;gap:10px;align-items:baseline}.fact dt{font:600 12.5px/20px var(--font-sans);letter-spacing:.75px;text-transform:uppercase}.fact dd{font-weight:500}.av{display:inline-flex;gap:10px;align-items:center;font-weight:600;font-size:15px;background:var(--navy);color:var(--mint);border-radius:var(--radius-pill);padding:6px 16px}.av i{width:10px;height:10px;border-radius:50%;background:var(--saffron)}</style></head><body><div class="row"><span style="font:600 12px/20px var(--font-sans);letter-spacing:1px;text-transform:uppercase">Zone Soft</span><span class="chip">WooCommerce</span><span class="chip">Holded</span><span class="date">Jan 2021 to Present</span></div><div class="row" style="margin-top:16px"><dl class="fact"><dt>Experience</dt><dd>25+ years</dd></dl><dl class="fact" style="background:var(--navy);color:var(--mint);border-color:var(--mint)"><dt style="color:var(--saffron)">Based in</dt><dd>Barcelona area, Spain</dd></dl><span class="av"><i></i>Open to freelance, contract and full-time work.</span></div></body></html>
